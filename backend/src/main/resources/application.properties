# ===================== SkillSwap Backend =====================
server.port=8080
spring.application.name=skillswap

# ===================== MySQL Database =====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillswap?serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ===================== JWT =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===================== CORS =====================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================== Demo Data =====================
app.seed-demo-data=true