# ===================== SkillSwap backend =====================
server.port=8080
spring.application.name=skillswap

# ---- MySQL (default) ----
# Create the database first:  CREATE DATABASE skillswap;
spring.datasource.url=jdbc:mysql://localhost:3306/skillswap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# ---- JWT ----
# Base64-encoded 256-bit secret. Change this for any real deployment.
app.jwt.secret=${JWT_SECRET:c2tpbGxzd2FwLWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS0yMDI2LWFybWlldA==}
app.jwt.expiration-ms=86400000

# ---- CORS: React dev server ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Seed demo users, requests and sessions on first start (empty database)
app.seed-demo-data=true
